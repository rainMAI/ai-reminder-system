<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI助手管理平台 - 登录/注册</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Microsoft YaHei", sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 450px;
        }

        .logo {
            text-align: center;
            margin-bottom: 40px;
            color: white;
        }

        .logo h1 {
            font-size: 48px;
            margin-bottom: 10px;
        }

        .logo p {
            font-size: 18px;
            opacity: 0.9;
        }

        .card {
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }

        .tabs {
            display: flex;
            margin-bottom: 30px;
            border-bottom: 2px solid #f0f0f0;
        }

        .tab {
            flex: 1;
            padding: 15px;
            text-align: center;
            cursor: pointer;
            font-weight: 600;
            color: #7f8c8d;
            border-bottom: 3px solid transparent;
            transition: all 0.3s;
        }

        .tab.active {
            color: #667eea;
            border-bottom-color: #667eea;
        }

        .form-container {
            display: none;
        }

        .form-container.active {
            display: block;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: #2c3e50;
        }

        .form-group input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 14px;
            transition: all 0.3s;
        }

        .form-group input:focus {
            outline: none;
            border-color: #667eea;
        }

        .form-group small {
            display: block;
            margin-top: 5px;
            color: #95a5a6;
            font-size: 12px;
        }

        .btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.4);
        }

        .btn-primary:active {
            transform: translateY(0);
        }

        .device-list {
            margin-top: 20px;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 10px;
        }

        .device-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
            background: white;
            border-radius: 8px;
            margin-bottom: 10px;
        }

        .device-info {
            flex: 1;
        }

        .device-name {
            font-weight: 600;
            color: #2c3e50;
        }

        .device-mac {
            font-size: 12px;
            color: #95a5a6;
        }

        .device-remove {
            padding: 6px 12px;
            background: #e74c3c;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
        }

        .alert {
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
        }

        .alert.show {
            display: block;
        }

        .alert-success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .alert-error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .loading {
            display: none;
            text-align: center;
            padding: 20px;
        }

        .loading.show {
            display: block;
        }

        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .add-device-btn {
            width: 100%;
            padding: 12px;
            border: 2px dashed #667eea;
            background: white;
            color: #667eea;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
        }

        .add-device-btn:hover {
            background: #667eea;
            color: white;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">
            <h1>🤖</h1>
            <h1>AI助手管理平台</h1>
            <p>统一管理您的AI助手设备</p>
        </div>

        <div class="card">
            <div class="tabs">
                <div class="tab active" onclick="switchTab('login')">登录</div>
                <div class="tab" onclick="switchTab('register')">注册</div>
            </div>

            <div id="loginAlert" class="alert"></div>
            <div id="loginLoading" class="loading">
                <div class="spinner"></div>
                <p>登录中...</p>
            </div>

            <!-- 登录表单 -->
            <div id="loginForm" class="form-container active">
                <form onsubmit="handleLogin(event)">
                    <div class="form-group">
                        <label>用户名</label>
                        <input type="text" id="loginUsername" required placeholder="请输入用户名">
                    </div>

                    <div class="form-group">
                        <label>密码</label>
                        <input type="password" id="loginPassword" required placeholder="请输入密码">
                    </div>

                    <button type="submit" class="btn btn-primary">登录</button>
                </form>
            </div>

            <!-- 注册表单 -->
            <div id="registerForm" class="form-container">
                <form onsubmit="handleRegister(event)">
                    <div class="form-group">
                        <label>用户名</label>
                        <input type="text" id="regUsername" required placeholder="3-50个字符" minlength="3" maxlength="50">
                        <small>用于登录，注册后不可修改</small>
                    </div>

                    <div class="form-group">
                        <label>密码</label>
                        <input type="password" id="regPassword" required placeholder="至少6个字符" minlength="6">
                        <small>建议使用字母、数字和符号的组合</small>
                    </div>

                    <div class="form-group">
                        <label>确认密码</label>
                        <input type="password" id="regPasswordConfirm" required placeholder="再次输入密码">
                    </div>

                    <div class="form-group">
                        <label>邮箱（可选）</label>
                        <input type="email" id="regEmail" placeholder="example@email.com">
                        <small>用于找回密码</small>
                    </div>

                    <div class="form-group">
                        <label>姓名（可选）</label>
                        <input type="text" id="regFullName" placeholder="您的真实姓名">
                    </div>

                    <div class="device-list">
                        <div style="margin-bottom: 10px; font-weight: 600; color: #2c3e50;">
                            我的设备
                        </div>
                        <div id="deviceList">
                            <div class="device-item">
                                <div class="device-info">
                                    <div class="device-name">暂无设备</div>
                                    <div class="device-mac">请添加您的AI设备</div>
                                </div>
                            </div>
                        </div>
                        <button type="button" class="add-device-btn" onclick="showAddDeviceModal()">
                            + 添加设备
                        </button>
                    </div>

                    <button type="submit" class="btn btn-primary" style="margin-top: 20px;">注册</button>
                </form>
            </div>
        </div>
    </div>

    <!-- 添加设备模态框 -->
    <div id="deviceModal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000; align-items: center; justify-content: center;">
        <div style="background: white; border-radius: 20px; padding: 30px; max-width: 400px; width: 90%;">
            <h2 style="margin-bottom: 20px; color: #2c3e50;">添加设备</h2>
            <div class="form-group">
                <label>设备名称</label>
                <input type="text" id="deviceName" placeholder="例如：客厅AI助手">
            </div>
            <div class="form-group">
                <label>设备MAC地址</label>
                <input type="text" id="deviceMac" placeholder="例如: 10:20:ba:02:c1:4c" style="text-transform: uppercase;">
                <small>在设备设置中可以找到MAC地址</small>
            </div>
            <div style="display: flex; gap: 10px;">
                <button type="button" class="btn" onclick="hideAddDeviceModal()" style="background: #95a5a6; color: white;">取消</button>
                <button type="button" class="btn btn-primary" onclick="addDevice()">添加</button>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = window.location.protocol + '//' + window.location.hostname + ':8081/api';
        let devices = [];

        // 切换标签
        function switchTab(tab) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.form-container').forEach(f => f.classList.remove('active'));

            if (tab === 'login') {
                document.querySelector('.tab:first-child').classList.add('active');
                document.getElementById('loginForm').classList.add('active');
            } else {
                document.querySelector('.tab:last-child').classList.add('active');
                document.getElementById('registerForm').classList.add('active');
            }

            hideAlert('loginAlert');
        }

        // 显示提示信息
        function showAlert(elementId, message, type) {
            const alert = document.getElementById(elementId);
            alert.textContent = message;
            alert.className = `alert alert-${type} show`;
            setTimeout(() => {
                alert.classList.remove('show');
            }, 5000);
        }

        // 隐藏提示信息
        function hideAlert(elementId) {
            document.getElementById(elementId).classList.remove('show');
        }

        // 显示加载中
        function showLoading(elementId) {
            document.getElementById(elementId).classList.add('show');
        }

        // 隐藏加载中
        function hideLoading(elementId) {
            document.getElementById(elementId).classList.remove('show');
        }

        // 登录处理
        async function handleLogin(event) {
            event.preventDefault();

            const username = document.getElementById('loginUsername').value;
            const password = document.getElementById('loginPassword').value;

            hideAlert('loginAlert');
            showLoading('loginLoading');

            try {
                const response = await fetch(`${API_BASE}/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                const data = await response.json();

                if (data.success) {
                    // 保存token
                    localStorage.setItem('session_token', data.token);
                    localStorage.setItem('username', data.user.username);
                    localStorage.setItem('user_id', data.user.id);

                    // 跳转到主页
                    window.location.href = '/static/portal.html';
                } else {
                    showAlert('loginAlert', data.error || '登录失败', 'error');
                }
            } catch (error) {
                showAlert('loginAlert', '网络错误，请稍后重试', 'error');
            } finally {
                hideLoading('loginLoading');
            }
        }

        // 注册处理
        async function handleRegister(event) {
            event.preventDefault();

            const username = document.getElementById('regUsername').value;
            const password = document.getElementById('regPassword').value;
            const passwordConfirm = document.getElementById('regPasswordConfirm').value;
            const email = document.getElementById('regEmail').value;
            const fullName = document.getElementById('regFullName').value;

            // 验证密码
            if (password !== passwordConfirm) {
                alert('两次输入的密码不一致');
                return;
            }

            if (devices.length === 0) {
                alert('请至少添加一个设备');
                return;
            }

            try {
                const response = await fetch(`${API_BASE}/auth/register`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        username,
                        password,
                        email,
                        full_name: fullName,
                        devices
                    })
                });

                const data = await response.json();

                if (data.success) {
                    alert('注册成功！请登录');
                    switchTab('login');
                    document.getElementById('loginUsername').value = username;
                } else {
                    alert(data.error || '注册失败');
                }
            } catch (error) {
                alert('网络错误，请稍后重试');
            }
        }

        // 显示添加设备模态框
        function showAddDeviceModal() {
            document.getElementById('deviceModal').style.display = 'flex';
        }

        // 隐藏添加设备模态框
        function hideAddDeviceModal() {
            document.getElementById('deviceModal').style.display = 'none';
            document.getElementById('deviceName').value = '';
            document.getElementById('deviceMac').value = '';
        }

        // 添加设备
        function addDevice() {
            const name = document.getElementById('deviceName').value;
            const mac = document.getElementById('deviceMac').value.trim();

            if (!name || !mac) {
                alert('请填写完整的设备信息');
                return;
            }

            // 验证MAC地址格式
            const macPattern = /^([0-9A-Fa-f]{2}[:-]){5}([0-9A-Fa-f]{2})$/;
            if (!macPattern.test(mac)) {
                alert('MAC地址格式不正确，应为: XX:XX:XX:XX:XX:XX');
                return;
            }

            // 检查是否已添加
            if (devices.find(d => d.mac_address.toLowerCase() === mac.toLowerCase())) {
                alert('该设备已添加');
                return;
            }

            devices.push({ device_name: name, mac_address: mac });
            updateDeviceList();
            hideAddDeviceModal();
        }

        // 移除设备
        function removeDevice(index) {
            devices.splice(index, 1);
            updateDeviceList();
        }

        // 更新设备列表显示
        function updateDeviceList() {
            const list = document.getElementById('deviceList');

            if (devices.length === 0) {
                list.innerHTML = `
                    <div class="device-item">
                        <div class="device-info">
                            <div class="device-name">暂无设备</div>
                            <div class="device-mac">请添加您的AI设备</div>
                        </div>
                    </div>
                `;
                return;
            }

            list.innerHTML = devices.map((device, index) => `
                <div class="device-item">
                    <div class="device-info">
                        <div class="device-name">${escapeHtml(device.device_name)}</div>
                        <div class="device-mac">${escapeHtml(device.mac_address)}</div>
                    </div>
                    <button type="button" class="device-remove" onclick="removeDevice(${index})">移除</button>
                </div>
            `).join('');
        }

        // HTML转义
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // 检查是否已登录
        window.addEventListener('load', () => {
            const token = localStorage.getItem('session_token');
            if (token) {
                // 验证token是否有效
                fetch(`${API_BASE}/auth/verify`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                })
                .then(res => res.json())
                .then(data => {
                    if (data.success) {
                        window.location.href = '/static/portal.html';
                    }
                })
                .catch(() => {
                    localStorage.removeItem('session_token');
                });
            }
        });
    </script>
</body>
</html>
